appId: com.vaani.desktop
productName: Vaani
copyright: Copyright © 2026 Vaani
asar: false
directories:
  output: release
  buildResources: build
files:
  - electron/**/*
  - dist/**/*
  - package.json
extraResources:
  - from: agent_dist/vaani-agent
    to: agent
    filter: ["**/*"]
linux:
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  category: Utility
  executableName: vaani
  artifactName: ${productName}-Linux-${version}-${arch}.${ext}
deb:
  depends:
    - libgtk-3-0
    - libnss3
    - libasound2
